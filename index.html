<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content">
        <header>
            <h1>CGPA Calculator </h1>
            <button class="clear-all-button" id="clearAllButton"> Clear All </button>
        </header>

        <main>
            <section class="panel add-subject-panel">
                <h2> Add Subject </h2>
                <form id="addSubjectForm">
                    <div class="field">
                        <label for="subjectName"> Subject </label>
                        <input id="subjectName" name="subjectName" maxlength="50" placeholder="ex. Web Dev 101" autocomplete="off" required>
                    </div>
                    <div class="select-fields">
                        <div class="field">
                            <label for="gradeSelect">Grade</label>
                            <select id="gradeSelect" name="gradeSelect" required>
                                <option value="A*">A*</option>
                                <option value="A">A</option>
                                <option value="B+">B+</option>
                                <option value="B">B </option>
                                <option value="B-">B-</option>
                                <option value="C">C</option>
                                <option value="F"> F</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="creditSelect">Credits</label>
                            <select id="creditSelect" name="creditSelect" required>
                                <option value="1">1</option>
                                <option value="2">2 </option>
                                <option value="3"> 3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="add-subject-button">Add Subject</button>
                </form>
            </section>

            <section class="panel display-cgpa-panel">
                <div class="cgpa">
                    <p> WEIGHTED CGPA </p>
                    <div id="cgpaValue" class="cgpa-value">0.00</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <p> Total Credits </p>
                        <strong id="totalCredits"> 0 </strong>
                    </div>
                    <div class="stat-box">
                        <p> Weighted Points</p>
                        <strong id="weightedPoints"> 0 </strong>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <section class="panel display-subjects-panel">
                <h2> Subjects </h2>
                <div id="emptyTable" class="empty-table"> No Subjects Yet. Add a subject to check CGPA. </div>
                <div>
                    <table>
                        <thead>
                            <tr>
                                <th>SUBJECT</th>
                                <th>GRADE</th>
                                <th>GRADE POINTS</th>
                                <th>CREDITS</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="subjectTableBody"></tbody>
                    </table>
                </div>
            </section>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
